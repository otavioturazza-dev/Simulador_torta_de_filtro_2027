<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acesso restrito | UAM</title>
<style>
:root{color-scheme:light dark;--bg:#F6F5F0;--surface:#fff;--line:#E1DDD0;--text:#1C2420;--muted:#5B675F;--green:#1F4D2B;--on:#F6F5F0;--gold:#C9A227;--err:#A32D2D}
@media(prefers-color-scheme:dark){:root{--bg:#121815;--surface:#1A221D;--line:#2F3A33;--text:#E9ECE6;--muted:#A3AFA7;--green:#7FC08F;--on:#121815;--gold:#D9B443;--err:#F09595}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 Inter,"Segoe UI",Arial,sans-serif;padding:20px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px}
h1{margin:0 0 4px;font-size:22px;color:var(--green)}
p{margin:0 0 20px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--green);color:var(--on);font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#err{min-height:20px;margin-top:10px;font-size:13px;color:var(--err)}
</style></head><body>
<form class="card" id="f" autocomplete="off">
  <h1>Acesso restrito</h1>
  <p>Simulador Torta de Filtro e Fuligem | UAM</p>
  <label for="pw">Senha</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <button id="b" type="submit">Entrar</button>
  <div id="err" role="alert"></div>
</form>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},k,u8(P.c));
  return new TextDecoder().decode(buf);
}
async function go(pw,silent){
  const b=document.getElementById('b'),e=document.getElementById('err');
  b.disabled=true;e.textContent='';
  try{
    const html=await open_(pw);
    try{sessionStorage.setItem('uam_tf',pw)}catch(_){}
    document.open();document.write(html);document.close();
  }catch(_){
    try{sessionStorage.removeItem('uam_tf')}catch(_){}
    b.disabled=false;
    if(!silent){e.textContent='Senha incorreta.';document.getElementById('pw').select();}
  }
}
document.getElementById('f').addEventListener('submit',ev=>{ev.preventDefault();go(document.getElementById('pw').value,false);});
if(!window.crypto||!crypto.subtle){document.getElementById('err').textContent='Abra o link por https para entrar.';}
else{let s=null;try{s=sessionStorage.getItem('uam_tf')}catch(_){}if(s)go(s,true);}
